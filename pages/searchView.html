<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search View</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</head>

<body class="bg-body-tertiary">
  <nav class="navbar bg-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center">

      <div class="d-flex align-items-center gap-3">
        <span class="navbar-brand mb-0 h1 fs-4 px-2 py-2 text-light">
          SearchView
        </span>

        <a href="SearchView.html" class="btn btn-outline-info">
          Scraper
        </a>

        <a href="SearchDbView.html" class="btn btn-outline-warning">
          Base de datos
        </a>
      </div>

      <button id="logoutBtn" class="btn btn-outline-light me-3">
        Logout
      </button>

    </div>
  </nav>

  <section class="px-5 py-3">
    <div class="row w-100">
      <div class="col-12 col-lg-4 mb-4 p-3">
        <div class="bg-dark p-3 rounded-3">
          <h4 class="text-light">Filtrar por:</h4>

          <form id="filterForm">
            <div class="my-3">
              <label for="profesionInput" class="form-label fw-bold">Profesión / Empleo</label>
              <input id="profesionInput" type="text" list="empleosList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: Pediatrician"
                autocomplete="off" />
              <datalist id="empleosList"></datalist>
            </div>

            <div class="my-3">
              <label for="ciudadInput" class="form-label fw-bold">Ciudad</label>
              <input id="ciudadInput" type="text" list="ciudadesList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: Echo Park"
                autocomplete="off" />
              <datalist id="ciudadesList"></datalist>
            </div>

            <div class="my-3">
              <label for="departamentoInput" class="form-label fw-bold">Estado</label>
              <input id="departamentoInput" type="text" list="departamentosList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: CA" autocomplete="off" />
              <datalist id="departamentosList"></datalist>
            </div>

            <div class="my-3">
              <label for="paisSelect" class="form-label fw-bold">Pais</label>
              <select id="paisSelect" class="form-select bg-dark text-light border-secondary" disabled>
                <option selected>Estados Unidos</option>
              </select>
            </div>

            <div class="my-3">
              <label for="fuenteSelect" class="form-label fw-bold">Fuente</label>
              <select id="fuenteSelect" class="form-select bg-dark text-light border-secondary" disabled>
                <option selected>Páginas Amarillas</option>
              </select>
            </div>

            <div class="my-3 d-grid gap-2">

              <button type="button" id="scrapeBtn" class="btn btn-primary w-100 my-2">
                Scrapear
              </button>

              <button type="button" id="savedDbBtn" class="btn btn-primary w-100 my-2">
                Guardar en base de datos
              </button>

              <button type="button" id="autoSaveDbBtn" class="btn btn-info w-100 my-2">
                Auto guardar (5 págs)
              </button>

            </div>
          </form>
        </div>
      </div>

      <div class="col-12 col-lg-8 mb-4 p-3">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
          <div>
            <h4 class="mb-1">Resultados encontrados</h4>
            <span id="resultsCount" class="badge text-bg-secondary">
              0 profesionales
            </span>
          </div>

          <div class="d-flex flex-column align-items-center gap-2">
            <span id="pageIndicator" class="badge text-bg-info d-none">Página 1 de 1</span>
            <div id="paginationContainer" class="mt-2"></div>
          </div>

          <div class="d-flex gap-2">
            <button id="downloadCsvBtn" class="btn btn-success">
              <i class="bi bi-filetype-csv me-1"></i> Descargar CSV
            </button>

            <button id="downloadJsonBtn" class="btn btn-warning">
              <i class="bi bi-filetype-json me-1"></i> Descargar JSON
            </button>

          </div>
        </div>

        <div id="loadingMessage" class="alert alert-info d-none">
          Cargando profesionales...
        </div>

        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <div id="resultsContainer"></div>

      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/searchView.api.js?v=20260515-5"></script>
  <script src="../js/searchView.js?v=20260515-5"></script>
</body>

</html>
