<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkedIn Search</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</head>

<body class="bg-body-tertiary">
  <nav class="navbar bg-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-brand mb-0 h1 fs-4 px-2 py-2 text-light">
          SearchView
        </span>

        <a href="SearchView.html" class="btn btn-outline-info">
          Scraper
        </a>

        <a href="SearchDbView.html" class="btn btn-outline-warning">
          Base de datos
        </a>

        <a href="searchlinkedinhtml.html" class="btn btn-outline-light">
          LinkedIn
        </a>
      </div>

      <button id="logoutBtn" class="btn btn-outline-light me-3">
        Logout
      </button>
    </div>
  </nav>

  <section class="px-5 py-3">
    <div class="row w-100">
      <div class="col-12 col-lg-4 mb-4 p-3">
        <div class="bg-dark p-3 rounded-3">
          <h4 class="text-light">Buscar en LinkedIn</h4>

          <form id="linkedinForm">
            <div class="my-3">
              <label for="profesionInput" class="form-label fw-bold">Profesión / Empleo</label>
              <input id="profesionInput" type="text" list="empleosList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: desarrollador de software"
                autocomplete="off" />
              <datalist id="empleosList"></datalist>
            </div>

            <div class="my-3">
              <label for="ciudadInput" class="form-label fw-bold">Ciudad</label>
              <input id="ciudadInput" type="text" list="ciudadesList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: San Salvador"
                autocomplete="off" />
              <datalist id="ciudadesList"></datalist>
            </div>

            <div class="my-3">
              <label for="departamentoInput" class="form-label fw-bold">Departamento / Estado</label>
              <input id="departamentoInput" type="text" list="departamentosList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: San Salvador"
                autocomplete="off" />
              <datalist id="departamentosList"></datalist>
            </div>

            <div class="my-3">
              <label for="paisInput" class="form-label fw-bold">País</label>
              <input id="paisInput" type="text"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: El Salvador"
                autocomplete="off" value="El Salvador" />
            </div>

            <div class="my-3">
              <label for="pageInput" class="form-label fw-bold">Página</label>
              <input id="pageInput" type="number" min="1" value="1"
                class="form-control bg-dark border-secondary text-light" />
            </div>

            <div class="my-3">
              <label for="pagesInput" class="form-label fw-bold">Páginas</label>
              <input id="pagesInput" type="number" min="1" value="1"
                class="form-control bg-dark border-secondary text-light" />
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="downloadPdfCheck" checked>
              <label class="form-check-label text-light" for="downloadPdfCheck">Descargar PDF</label>
            </div>

            <div class="my-3 d-grid gap-2">
              <button type="submit" class="btn btn-primary w-100 my-2">
                Buscar LinkedIn
              </button>

              <button type="button" id="saveDbBtn" class="btn btn-success w-100 my-2">
                Guardar en base de datos
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-12 col-lg-8 mb-4 p-3">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
          <div>
            <h4 class="mb-1">Resultados encontrados</h4>
            <span id="resultsCount" class="badge text-bg-secondary">0 resultados</span>
          </div>
        </div>

        <div id="loadingMessage" class="alert alert-info d-none">Buscando personas...</div>
        <div id="errorMessage" class="alert alert-danger d-none"></div>
        <div id="resultsContainer"></div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/searchView.api.js"></script>
  <script src="../js/searchLinkedin.api.js"></script>
  <script>
    const form = document.getElementById('linkedinForm');
    const professionInput = document.getElementById('profesionInput');
    const cityInput = document.getElementById('ciudadInput');
    const stateInput = document.getElementById('departamentoInput');
    const countryInput = document.getElementById('paisInput');
    const empleosList = document.getElementById('empleosList');
    const ciudadesList = document.getElementById('ciudadesList');
    const departamentosList = document.getElementById('departamentosList');
    const pageInput = document.getElementById('pageInput');
    const pagesInput = document.getElementById('pagesInput');
    const downloadPdfCheck = document.getElementById('downloadPdfCheck');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsCount = document.getElementById('resultsCount');
    const loadingMessage = document.getElementById('loadingMessage');
    const errorMessage = document.getElementById('errorMessage');
    const saveDbBtn = document.getElementById('saveDbBtn');

    let selectedCiudadId = null;
    let selectedDepartamentoId = null;
    let selectedEmpleoId = null;
    let ciudadesCache = [];
    let departamentosCache = [];
    let empleosCache = [];
    let linkedinPeople = [];

    function showLoading(show, text = 'Buscando personas...') {
      loadingMessage.textContent = text;
      loadingMessage.classList.toggle('d-none', !show);
    }

    function showError(message = '') {
      errorMessage.textContent = message;
      errorMessage.classList.toggle('d-none', !message);
    }

    function normalizeListResponse(response) {
      if (Array.isArray(response)) return response;
      if (Array.isArray(response?.data)) return response.data;
      if (Array.isArray(response?.items)) return response.items;
      if (Array.isArray(response?.ciudades)) return response.ciudades;
      if (Array.isArray(response?.departamentos)) return response.departamentos;
      if (Array.isArray(response?.empleos)) return response.empleos;
      return [];
    }

    function getEmpleoId(empleo) {
      return empleo?.id_empleo ?? empleo?.id ?? empleo?.idEmpleo ?? null;
    }

    function getEmpleoName(empleo) {
      return empleo?.nombre ?? empleo?.empleo ?? empleo?.titulo ?? empleo?.name ?? '';
    }

    function getCiudadId(ciudad) {
      return ciudad?.id_ciudad ?? ciudad?.id ?? ciudad?.idCiudad ?? null;
    }

    function getDepartamentoId(departamento) {
      return departamento?.id_departamento ?? departamento?.id ?? departamento?.idDepartamento ?? null;
    }

    function getCiudadName(ciudad) {
      return ciudad?.nombre ?? ciudad?.ciudad ?? ciudad?.name ?? '';
    }

    function getDepartamentoName(departamento) {
      return departamento?.nombre ?? departamento?.departamento ?? departamento?.state ?? departamento?.name ?? '';
    }

    function getTextOrNull(value) {
      if (value == null) return null;

      if (typeof value === 'object') {
        return getTextOrNull(value.nombre ?? value.name ?? value.text ?? value.value ?? value.ciudad ?? value.departamento ?? value.state);
      }

      const text = String(value).trim();
      return text || null;
    }

    function getPersonLocationText(person, keys) {
      for (const key of keys) {
        const value = getTextOrNull(person?.[key]);
        if (value) return value;
      }

      for (const key of keys) {
        const value = getTextOrNull(person?.parsedLocation?.[key]);
        if (value) return value;
      }

      return null;
    }

    function syncSelectedIds() {
      const empleoNombre = professionInput.value.trim().toLowerCase();
      const ciudadNombre = cityInput.value.trim().toLowerCase();
      const departamentoNombre = stateInput.value.trim().toLowerCase();

      selectedEmpleoId = empleosCache.find((empleo) => getEmpleoName(empleo).toLowerCase() === empleoNombre)?.id_empleo
        ?? empleosCache.find((empleo) => getEmpleoName(empleo).toLowerCase() === empleoNombre)?.id
        ?? null;

      selectedCiudadId = ciudadesCache.find((ciudad) => getCiudadName(ciudad).toLowerCase() === ciudadNombre)?.id_ciudad
        ?? ciudadesCache.find((ciudad) => getCiudadName(ciudad).toLowerCase() === ciudadNombre)?.id
        ?? null;

      selectedDepartamentoId = departamentosCache.find((departamento) => getDepartamentoName(departamento).toLowerCase() === departamentoNombre)?.id_departamento
        ?? departamentosCache.find((departamento) => getDepartamentoName(departamento).toLowerCase() === departamentoNombre)?.id
        ?? null;
    }

    function populateOptions(listElement, items, getName) {
      listElement.innerHTML = '';
      items.forEach((item) => {
        const name = getName(item);
        if (!name) return;

        const option = document.createElement('option');
        option.value = name;
        listElement.appendChild(option);
      });
    }

    async function loadFilterOptions() {
      try {
        ciudadesList.innerHTML = '';
        departamentosList.innerHTML = '';
        empleosList.innerHTML = '';

        const [ciudadesResponse, departamentosResponse, empleosResponse] = await Promise.all([
          fetchCiudades(),
          fetchDepartamentos(),
          fetchEmpleos(),
        ]);

        const ciudades = normalizeListResponse(ciudadesResponse);
        const departamentos = normalizeListResponse(departamentosResponse);
        const empleos = normalizeListResponse(empleosResponse);

        ciudadesCache = ciudades;
        departamentosCache = departamentos;
        empleosCache = empleos;

        populateOptions(ciudadesList, ciudades, getCiudadName);
        populateOptions(departamentosList, departamentos, getDepartamentoName);
        populateOptions(empleosList, empleos, getEmpleoName);

        if (!ciudades.length || !departamentos.length || !empleos.length) {
          showError('No se encontraron ciudades, estados o empleos para mostrar.');
          return;
        }

        showError();
      } catch (error) {
        console.error('Error cargando opciones:', error);
        showError('No se pudieron cargar las ciudades, estados y empleos. Verifica sesión y backend.');
      }
    }

    function renderResults(data) {
      resultsContainer.innerHTML = '';
      const items = Array.isArray(data?.people) ? data.people : (Array.isArray(data) ? data : (data?.data || data?.results || []));
      linkedinPeople = items;
      resultsCount.textContent = `${items.length} resultado${items.length !== 1 ? 's' : ''}`;

      if (!items.length) {
        resultsContainer.innerHTML = '<div class="alert alert-warning">No se encontraron resultados.</div>';
        return;
      }

      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card bg-dark my-3';
        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title text-light">${item.name || item.nombre || 'Sin nombre'}</h5>
            <p class="card-text fw-semibold text-info">${item.profession || item.profesion || 'Sin profesión'}</p>
            <p class="card-text text-secondary">${item.location || item.ubicacion || item.country || 'Sin ubicación'}</p>
            <p class="card-text text-secondary">${item.rawText ? item.rawText.substring(0, 180) + (item.rawText.length > 180 ? '...' : '') : ''}</p>
            ${item.profileUrl || item.perfil_url ? `<a href="${item.profileUrl || item.perfil_url}" target="_blank" class="btn btn-outline-info btn-sm">Ver perfil</a>` : ''}
            ${item.pdfDownloaded ? '<span class="badge text-bg-success ms-2">PDF descargado</span>' : ''}
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    [professionInput, cityInput, stateInput].forEach((input) => {
      input.addEventListener('change', syncSelectedIds);
      input.addEventListener('blur', syncSelectedIds);
    });

    async function handleSearch() {
      showLoading(true);
      showError();
      syncSelectedIds();

      try {
        const pageStart = Number(pageInput.value) || 1;
        const pageEnd = pageStart + (Number(pagesInput.value) || 1) - 1;

        const result = await searchLinkedinPeople({
          profession: professionInput.value.trim(),
          country: countryInput.value.trim() || 'El Salvador',
          pageStart,
          pageEnd,
          downloadPdf: downloadPdfCheck.checked,
        });

        renderResults(result);
      } catch (error) {
        console.error(error);
        showError(error.message || 'Error al consultar LinkedIn.');
      } finally {
        showLoading(false);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      await handleSearch();
    });

    saveDbBtn.addEventListener('click', async () => {
      try {
        if (!linkedinPeople.length) {
          return alert('No hay personas para guardar.');
        }

        // if (!selectedCiudadId || !selectedDepartamentoId) {
        //   return alert('Selecciona una ciudad válida de la lista antes de guardar.');
        // }

        if (professionInput.value.trim() && !selectedEmpleoId) {
          return alert('Selecciona un empleo válido de la lista antes de guardar.');
        }

        const payload = linkedinPeople.map((person, index) => ({
          nombre: person.name || person.nombre || `Persona ${index + 1}`,
          apellido: '',
          profesion: person.profession || person.profesion || '',
          pais: countryInput.value.trim() || 'El Salvador',
          id_departamento: selectedDepartamentoId,
          id_ciudad: selectedCiudadId,
          ciudad_texto: getPersonLocationText(person, ['ciudad_texto', 'ciudadTexto', 'cityText', 'city', 'ciudad']),
          departamento_texto: getPersonLocationText(person, ['departamento_texto', 'departamentoTexto', 'departmentText', 'stateText', 'department', 'departamento', 'estado', 'state']),
          id_fuente: 1,
          id_empleo: selectedEmpleoId ?? undefined,
          email: null,
          telefono: null,
          perfil_url: person.profileUrl || person.perfil_url || null,
          fecha_publicacion: new Date().toISOString(),
        }));

        console.table(payload.map((person) => ({
          nombre: person.nombre,
          ciudad_texto: person.ciudad_texto,
          departamento_texto: person.departamento_texto,
          id_ciudad: person.id_ciudad,
          id_departamento: person.id_departamento,
        })));
        console.log('Primer payload LinkedIn:', JSON.stringify(payload[0], null, 2));
        console.log('Payload LinkedIn JSON:', JSON.stringify(payload, null, 2));

        const saveResponse = await saveProfesionales(payload);
        const savedCount = Array.isArray(saveResponse)
          ? saveResponse.length
          : saveResponse?.count ?? saveResponse?.saved ?? saveResponse?.inserted ?? saveResponse?.affected ?? payload.length;

        alert(`Profesionales guardados correctamente: ${savedCount}`);
      } catch (error) {
        console.error(error);
        alert('Error guardando profesionales.');
      }
    });

    loadFilterOptions();
  </script>
</body>

</html>
