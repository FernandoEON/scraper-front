<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search DB View</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <style>
    .top-nav {
      background: #111827;
      border-bottom: 1px solid #2a2f3a;
    }
    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-right: 14px;
    }
    .nav-link-btn { white-space: nowrap; }
  </style>
</head>

<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark top-nav">
  <div class="container-fluid px-3 px-lg-4">
    <span class="brand">Scraper Console</span>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="topNavMenu">
      <div class="d-flex flex-column flex-lg-row gap-2">
        <a href="searchdbView.html" class="btn btn-warning nav-link-btn">Base de Datos</a>
        <a href="searchView.html" class="btn btn-outline-info nav-link-btn">Scraper YP</a>
        <a href="searchlinkedin.html" class="btn btn-outline-light nav-link-btn">LinkedIn Personas</a>
        <a href="searchlinkedinjobs.html" class="btn btn-outline-success nav-link-btn">LinkedIn Ofertas</a>
      </div>
      <button id="logoutBtn" class="btn btn-outline-light ms-lg-auto mt-2 mt-lg-0">Logout</button>
    </div>
  </div>
</nav>
  <section class="px-4 px-lg-5 py-3">
    <div class="row w-100">
      <div class="col-12 col-lg-4 mb-4 p-3">
        <div class="bg-dark p-3 rounded-3">
          <h4 class="text-light">Filtrar por:</h4>

          <form id="filterForm">
            <div class="my-3">
              <label for="qInput" class="form-label fw-bold">Búsqueda general</label>
              <input id="qInput" type="text"
                class="form-control bg-dark border-secondary text-light" placeholder="Nombre, email, teléfono, perfil, empleo, fuente..."
                autocomplete="off" />
            </div>

            <div class="my-3">
              <label for="profesionInput" class="form-label fw-bold">Profesión contiene</label>
              <input id="profesionInput" type="text" list="empleosList"
                class="form-control bg-dark border-secondary text-light" placeholder="Ej: Ingeniero"
                autocomplete="off" />
              <datalist id="empleosList"></datalist>
            </div>

            <div class="my-3">
              <label for="fuenteSelect" class="form-label fw-bold">Fuente</label>
              <select id="fuenteSelect" class="form-select bg-dark text-light border-secondary">
                <option value="">Todas las fuentes</option>
              </select>
            </div>

            <div class="my-3">
              <label for="paisSelect" class="form-label fw-bold">País</label>
              <select id="paisSelect" class="form-select bg-dark text-light border-secondary">
                <option value="">Todos los países</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <option value="El Salvador">El Salvador</option>
                <option value="Guatemala">Guatemala</option>
              </select>
            </div>

            <div class="my-3">
              <label for="departamentoInput" class="form-label fw-bold">Estado / Departamento</label>
              <select id="departamentoInput" class="form-select bg-dark border-secondary text-light">
                <option value="">Todos los estados/departamentos</option>
              </select>
            </div>

            <div class="my-3">
              <label for="ciudadInput" class="form-label fw-bold">Ciudad</label>
              <select id="ciudadInput" class="form-select bg-dark border-secondary text-light">
                <option value="">Todas las ciudades</option>
              </select>
            </div>

            <div class="my-3">
              <label for="limitInput" class="form-label fw-bold">Resultados por página</label>
              <input id="limitInput" type="number" min="30" max="10000" step="10"
                class="form-control bg-dark border-secondary text-light" value="30" />
            </div>

            <div class="my-3 d-grid gap-2">
              <button type="submit" class="btn btn-primary w-100 my-2">Filtrar</button>
              <button type="button" id="clearBtn" class="btn btn-secondary w-100 my-2">Limpiar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-12 col-lg-8 mb-4 p-3">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
          <div>
            <h4 class="mb-1">Resultados encontrados</h4>
            <span id="resultsCount" class="badge text-bg-secondary">0 profesionales</span>
          </div>

          <div id="paginationContainerTop" class="mt-4"></div>


          <div class="d-flex gap-2">
            <button id="downloadCsvBtn" class="btn btn-success">
              <i class="bi bi-filetype-csv me-1"></i> Descargar CSV
            </button>
            <button id="downloadJsonBtn" class="btn btn-warning">
              <i class="bi bi-filetype-json me-1"></i> Descargar JSON
            </button>
          </div>
        </div>

        <div id="loadingMessage" class="alert alert-info d-none">Cargando profesionales...</div>
        <div id="errorMessage" class="alert alert-danger d-none"></div>
        <div id="resultsContainer"></div>
        <div id="paginationContainerBottom" class="mt-4"></div>
      </div>
    </div>
  </section>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/SearchDbView.js"></script>
</body>

</html>
