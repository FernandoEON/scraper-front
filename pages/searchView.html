<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search View</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-body-tertiary">
    <!-- NAV BAR -->
    <nav class="navbar bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fs-4 px-5 py-2 text-light"
          >SearchView</span
        >
      </div>
    </nav>
    <!-- SECCIÓN DE FILTROS -->
    <section class="px-5 py-3">
      <div class="row w-100">
        <!-- FILTROS -->
        <div class="col-12 col-lg-4 mb-4 p-3">
          <div class="bg-dark p-3 rounded-3">
            <h4 class="text-light">Filtrar por:</h4>
            <form id="filterForm">
              <!-- PROFESIÓN -->
              <div class="my-3">
                <label class="form-label label-custom fw-bold">Profesión</label>
                <input
                  type="text"
                  id="inputProfesion"
                  class="form-control bg-dark border-secondary text-light"
                  placeholder="Ej: Ingeniero"
                />
              </div>
              <!-- PAÍS -->
              <div class="my-3">
                <label class="form-label label-custom fw-bold">País</label>
                <input
                  type="text"
                  id="inputPais"
                  class="form-control bg-dark border-secondary text-light"
                  placeholder="Ej: El Salvador"
                />
              </div>
              <!-- DEPARTAMENTO -->
              <div class="my-3">
                <label class="form-label label-custom fw-bold"
                  >Departamento</label
                >
                <select class="form-select" id="selectDepartamento">
                  <option value="" selected disabled hidden>
                    Seleccione un departamento:
                  </option>
                </select>
              </div>
              <!-- CIUDAD -->
              <div class="my-3">
                <label class="form-label label-custom fw-bold">Ciudad</label>
                <select class="form-select" id="selectCiudad">
                  <option value="" selected disabled hidden>
                    Seleccione una ciudad:
                  </option>
                </select>
              </div>
              <!-- BOTONES -->
              <div class="my-3 d-grid gap-2">
                <button type="submit" class="btn btn-primary w-100 my-2">
                  Filtrar
                </button>
                <button type="reset" class="btn btn-secondary w-100 my-2">
                  Limpiar
                </button>
              </div>
            </form>
          </div>
        </div>
        <!-- RESULTADOS -->
        <div class="col-12 col-lg-8 mb-4 p-3" id="resultsContainer">
          <!-- TÍTULO + CANTIDAD DE PERSONAS ENCONTRADAS -->
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4"
          >
            <h4>Resultados encontrados</h4>
            <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
              <span
                class="badge text-bg-secondary"
                id="totalProfessionals"
              ></span>
              <button
                class="btn btn-sm btn-outline-success"
                id="btnDownloadJSON"
              >
                <i class="bi bi-filetype-json me-1"></i>JSON
              </button>
              <button
                class="btn btn-sm btn-outline-warning"
                id="btnDownloadCSV"
              >
                <i class="bi bi-filetype-csv me-1"></i>CSV
              </button>
            </div>
          </div>
          <!-- LISTA DE RESULTADOS DE PROFESIONALES  -->
          <div id="resultsList"></div>
        </div>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../js/searchScript.js"></script>
  </body>
</html>
