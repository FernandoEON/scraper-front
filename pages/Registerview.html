<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/registerview.css">
</head>
<body>

    <div class="login-card">
        
        <div id="formulario-container">
            <h2>Crear Cuenta</h2>
            
            <form id="miFormulario" autocomplete="off">
                <div class="form-group">
                    <input type="text" id="nombre" name="nombre" placeholder=" " required>
                    <label for="nombre">Nombre</label>
                </div>

                <div class="form-group">
                    <input type="text" id="apellido" name="apellido" placeholder=" " required>
                    <label for="apellido">Apellido</label>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder=" " required>
                    <label for="email">Correo Electrónico</label>
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder=" " required>
                    <label for="password">Contraseña</label>
                    
                    <div class="strength-container">
                        <div class="strength-bar" id="barra-fuerza"></div>
                        <span class="strength-text" id="texto-fuerza"></span>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password" id="confirm" name="confirm" placeholder=" " required>
                    <label for="confirm">Confirmar Contraseña</label>
                    <small id="error-msg" class="error-text">Las contraseñas no coinciden</small>
                </div>

                <button type="submit" class="btn-submit">
                    Registrarse
                </button>
            </form>
            
            <div class="links">
                <a href="#">Ya tengo cuenta, iniciar sesión</a>
            </div>
        </div>

        <div id="mensaje-exito" style="display: none; text-align: center;">
            <div class="icon-success">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2>¡Cuenta Creada!</h2>
            <p style="color: #64748b; margin-bottom: 20px;">Hemos registrado tus datos correctamente en el sistema.</p>
            <button class="btn-submit" onclick="location.reload()">Volver al inicio</button>
        </div>

    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');
        const errorMsg = document.getElementById('error-msg');
        const barraFuerza = document.getElementById('barra-fuerza');
        const textoFuerza = document.getElementById('texto-fuerza');
        const formulario = document.getElementById('miFormulario');
        const contenedorForm = document.getElementById('formulario-container');
        const mensajeExito = document.getElementById('mensaje-exito');

        passwordInput.addEventListener('input', function() {
            const val = passwordInput.value;
            let fuerza = 0;
            let color = '#ddd';
            let ancho = '0%';
            let texto = '';

            if (val.length > 5) fuerza++;
            if (val.length > 8) fuerza++;
            if (/[0-9]/.test(val)) fuerza++;
            if (/[^A-Za-z0-9]/.test(val)) fuerza++;

            switch(fuerza) {
                case 0: case 1: color = '#ef4444'; ancho = '25%'; texto = 'Débil'; break;
                case 2: case 3: color = '#eab308'; ancho = '60%'; texto = 'Media'; break;
                case 4: color = '#22c55e'; ancho = '100%'; texto = 'Segura'; break;
            }
            if(val.length === 0) { ancho = '0%'; texto = ''; }

            barraFuerza.style.backgroundColor = color;
            barraFuerza.style.width = ancho;
            textoFuerza.textContent = texto;
            textoFuerza.style.color = color;
        });

        confirmInput.addEventListener('input', function() {
            if (errorMsg.style.display === 'block') {
                errorMsg.style.display = 'none';
                confirmInput.classList.remove('input-error');
            }
        });

        formulario.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (passwordInput.value !== confirmInput.value) {
                errorMsg.style.display = 'block';
                confirmInput.classList.add('input-error');
                return;
            }

            const btn = document.querySelector('.btn-submit');
            btn.textContent = "Procesando...";
            
            setTimeout(() => {
                contenedorForm.style.display = 'none';
                mensajeExito.style.display = 'block';
            }, 1000);
        });
    </script>
</body>
</html>
